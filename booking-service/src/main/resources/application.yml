server.port: 8082
spring.application.name: booking-service
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
security.jwt.secret: ${JWT_SECRET:student-hotel-demo-secret-at-least-32-characters}
spring.datasource.url: jdbc:h2:mem:booking-service;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.jpa.hibernate.ddl-auto: create-drop
spring.jpa.open-in-view: false
spring.jpa.properties.hibernate.jdbc.time_zone: UTC
security.internal-key: ${INTERNAL_KEY:student-internal-demo-key}
logging.pattern.console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId}] %logger{36} - %msg%n"
hotel.base-url: http://hotel-service
hotel.timeout-ms: 1000
hotel.retry-delay-ms: 100
hotel.max-attempts: 3
booking.compensation-delay-ms: 5000
eureka.instance.hostname: localhost
