name: hotel-service

services:
  eureka-server:
    build:
      context: .
      args:
        SERVICE: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/eureka/apps"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  hotel-service:
    build:
      context: .
      args:
        SERVICE: hotel-service
    ports:
      - "8081:8081"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: hotel-service
      JWT_SECRET: ${JWT_SECRET:-student-hotel-demo-secret-at-least-32-characters}
      INTERNAL_KEY: ${INTERNAL_KEY:-student-internal-demo-key}
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/v3/api-docs"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  booking-service:
    build:
      context: .
      args:
        SERVICE: booking-service
    ports:
      - "8082:8082"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: booking-service
      JWT_SECRET: ${JWT_SECRET:-student-hotel-demo-secret-at-least-32-characters}
      INTERNAL_KEY: ${INTERNAL_KEY:-student-internal-demo-key}
    depends_on:
      eureka-server:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/v3/api-docs"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  api-gateway:
    build:
      context: .
      args:
        SERVICE: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      JWT_SECRET: ${JWT_SECRET:-student-hotel-demo-secret-at-least-32-characters}
    depends_on:
      eureka-server:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/hotels)\" = 401"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
